<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default " ja" }}" prefix="og: http://ogp.me/ns#">

<head>
  <title>
    {{- if .IsHome -}}
    Amazon おすすめ 比較 徹底調査レポート | {{ .Site.Title }}
    {{- else if .Params.score -}}
    【{{ .Params.score }}点】{{ .Title }} {{ .Params.price }} レビュー | {{ .Site.Title }}
    {{- else if eq .Section "recommendations" -}}
    本日の注目商品10選！AI厳選レビュー | {{ .Site.Title }}
    {{- else if eq .Type "categories" -}}
    Amazon {{ .Title }} おすすめ比較ランキング | AI徹底調査 | {{ .Site.Title }}
    {{- else -}}
    {{ .Title }} レビュー | {{ .Site.Title }}
    {{- end -}}
  </title>

  {{- partial "head.html" . -}}
</head>

<body>
  {{- partial "header.html" . -}}

  <main>
    {{- block "main" . -}}{{- end -}}
  </main>

  {{- partial "footer.html" . -}}
  <button id="scroll-to-top" class="scroll-to-top" aria-label="トップに戻る">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</body>

</html>
