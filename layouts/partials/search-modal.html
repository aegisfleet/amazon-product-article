<!-- Global Search Modal (Material Design 3 Dialog) -->
<dialog id="search-modal" class="search-modal" aria-label="商品・スペック検索">
    <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
    <div class="search-modal-container">
        <div class="search-modal-header">
            <div class="search-modal-title">
                <span class="search-modal-icon" aria-hidden="true">🔍</span>
                <span class="search-modal-title-text">商品を検索</span>
            </div>
            <button type="button" class="search-modal-close" id="search-modal-close" aria-label="検索を閉じる (Esc)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="search-container modal-search-container">
            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <label for="search-input" class="sr-only">キーワード・Amazon URLで検索</label>
                <input type="text" id="search-input" class="search-input" placeholder="キーワード・スペック・Amazon URLで探す" autocomplete="off"
                    aria-label="キーワード・Amazon URLで検索" data-search-index-url="{{ `index.json` | relURL }}"
                    data-search-worker-url="{{ `js/search-worker.js` | relURL }}"
                    {{ with .Site.Params.productRequestFormUrl }}data-request-form-url="{{ . }}"{{ end }}>
                <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="検索キーワードをクリア" tabindex="-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="search-filter-toggle-wrapper">
                <button type="button" class="search-filter-toggle-btn" id="search-filter-toggle-btn" aria-expanded="false" aria-controls="search-filters-wrapper">
                    <svg class="filter-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    <span>絞り込みフィルター</span>
                    <span class="filter-count-badge" id="filter-count-badge" style="display: none;">0</span>
                    <svg class="filter-chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>

            <div class="search-filters-wrapper" id="search-filters-wrapper">
                <div class="search-filters">
                    <div class="filter-group">
                        <span class="filter-label">
                            <span class="material-symbols-outlined filter-icon" aria-hidden="true">trophy</span> スコア
                        </span>
                        <div class="filter-inputs">
                            <label for="filter-score-min" class="sr-only">スコア下限</label>
                            <input type="number" id="filter-score-min" class="filter-input-small" value="70" min="0" max="100"
                                step="10" placeholder="70" aria-label="スコア下限">
                            <span class="filter-separator" aria-hidden="true">〜</span>
                            <label for="filter-score-max" class="sr-only">スコア上限</label>
                            <input type="number" id="filter-score-max" class="filter-input-small" min="0" max="100" step="10"
                                placeholder="100" aria-label="スコア上限">
                        </div>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">
                            <span class="material-symbols-outlined filter-icon" aria-hidden="true">payments</span> 価格 (円)
                        </span>
                        <div class="filter-inputs">
                            <label for="filter-price-min" class="sr-only">価格下限 (円)</label>
                            <input type="number" id="filter-price-min" class="filter-input-medium" min="0" step="1000"
                                placeholder="下限なし" aria-label="価格下限 (円)">
                            <span class="filter-separator" aria-hidden="true">〜</span>
                            <label for="filter-price-max" class="sr-only">価格上限 (円)</label>
                            <input type="number" id="filter-price-max" class="filter-input-medium" min="0" step="1000"
                                placeholder="上限なし" aria-label="価格上限 (円)">
                        </div>
                    </div>
                    <div class="filter-actions">
                        <button type="button" class="filter-reset-btn" id="filter-reset-btn" aria-label="条件をクリア">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                            条件をクリア
                        </button>
                    </div>
                    <!-- Active Filter Chips (Material Design 3) -->
                    <div id="search-active-chips" class="m3-active-chips-container" style="display: none;"></div>
                </div>
            </div>

            <div id="search-results"></div>
        </div>

        <div class="search-modal-footer">
            <span class="search-modal-tip">💡 <kbd>Esc</kbd> で閉じる / <kbd>↑</kbd><kbd>↓</kbd> で選択 / <kbd>Enter</kbd> で決定</span>
        </div>
    </div>
</dialog>
