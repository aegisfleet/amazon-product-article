<header class="site-header">
    <div class="container header-content">
        <a href="{{ `` | relURL }}" class="brand">
            <span class="brand-icon">📦</span>
            Amazon商品徹底比較.com
        </a>

        <nav class="site-header-nav" aria-label="グローバルナビゲーション">
            <ul class="header-nav-list">
                <li><a href="{{ `` | relURL }}" class="header-nav-link">ホーム</a></li>
                <li><a href="{{ `recommendations/` | relURL }}" class="header-nav-link">注目商品</a></li>
                <li><a href="{{ `bargain/` | relURL }}" class="header-nav-link">あともう一品</a></li>
                <li><a href="{{ `deals/` | relURL }}" class="header-nav-link">セール対象</a></li>
                <li><a href="{{ `brand/` | relURL }}" class="header-nav-link">ブランド一覧</a></li>
                <li><a href="{{ `low-scores/` | relURL }}" class="header-nav-link">低スコア迷品館</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="{{ `favorites/` | relURL }}" class="favorites-nav-btn" id="favorites-nav-btn"
                aria-label="お気に入りリスト">
                <span class="fav-nav-icon" aria-hidden="true">🤍</span>
                <span class="favorites-badge" id="favorites-badge" style="display:none;" aria-live="polite"></span>
            </a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                <span class="theme-toggle-icon"></span>
            </button>
        </div>
    </div>
</header>
<script>
    (function () {
        function highlightActiveHeaderNav() {
            var currentPath = window.location.pathname;
            var links = document.querySelectorAll('.header-nav-link');
            links.forEach(function (link) {
                var href = link.getAttribute('href');
                if (!href) return;
                var isHome = href === '/' || href === '' || href.endsWith('/index.html');
                var isMatch = false;
                if (isHome) {
                    isMatch = currentPath === '/' || currentPath === '' || currentPath.endsWith('/index.html');
                } else {
                    isMatch = currentPath === href || (href !== '/' && currentPath.indexOf(href) === 0);
                }
                if (isMatch) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                } else {
                    link.classList.remove('active');
                    link.removeAttribute('aria-current');
                }
            });
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', highlightActiveHeaderNav);
        } else {
            highlightActiveHeaderNav();
        }
    })();
</script>

<div id="nav-drawer-overlay" class="nav-drawer-overlay" aria-hidden="true"></div>

<aside id="site-nav-drawer" class="nav-drawer" aria-label="サイドナビゲーション" aria-hidden="true">
    <div class="nav-drawer-header">
        <h2 class="nav-drawer-title">メニュー</h2>
        <button id="nav-menu-close" class="nav-drawer-close" aria-label="メニューを閉じる">✕</button>
    </div>
    <nav class="nav-drawer-body" aria-label="メニューナビゲーション">
        <ul class="nav-drawer-list">
            <li>
                <a href="{{ `` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">🏠</span>
                    <span class="nav-drawer-label">ホーム</span>
                </a>
            </li>
            <li>
                <a href="{{ `recommendations/` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">🎯</span>
                    <span class="nav-drawer-label">本日の注目商品</span>
                </a>
            </li>
            <li>
                <a href="{{ `bargain/` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">🎁</span>
                    <span class="nav-drawer-label">あともう一品</span>
                </a>
            </li>
            <li>
                <a href="{{ `deals/` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">🔥</span>
                    <span class="nav-drawer-label">セール対象商品一覧</span>
                </a>
            </li>
            <li>
                <a href="{{ `brand/` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">🏢</span>
                    <span class="nav-drawer-label">ブランド一覧</span>
                </a>
            </li>
            {{- with .Site.Params.productRequestFormUrl -}}
            <li>
                <a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="nav-drawer-item" aria-label="商品調査リクエスト（新しいタブで開く）">
                    <span class="nav-drawer-icon" aria-hidden="true">📝</span>
                    <span class="nav-drawer-label">商品調査リクエスト</span>
                </a>
            </li>
            {{- end -}}
            <li>
                <a href="{{ `low-scores/` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">📉</span>
                    <span class="nav-drawer-label">低スコア迷品館</span>
                </a>
            </li>
            <li>
                <a href="{{ `favorites/` | relURL }}" class="nav-drawer-item">
                    <span class="nav-drawer-icon" aria-hidden="true">🤍</span>
                    <span class="nav-drawer-label">お気に入り</span>
                    <span class="favorites-badge nav-drawer-badge" id="drawer-favorites-badge" style="display:none;" aria-live="polite"></span>
                </a>
            </li>
        </ul>
    </nav>
</aside>

<button id="nav-menu-floating-toggle" class="nav-menu-toggle nav-menu-floating-toggle" aria-label="ナビゲーションメニューを開く" aria-expanded="false" aria-controls="site-nav-drawer">
    <span class="nav-toggle-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
    </span>
    <span class="nav-toggle-text">メニュー</span>
</button>
