{{- if .TableOfContents -}}
<!-- Floating Action Button for Mobile TOC -->
<button id="toc-fab" class="toc-fab" aria-label="目次を開く" aria-expanded="false" aria-controls="toc-modal" type="button">
    <span class="toc-fab-icon" aria-hidden="true">📑</span>
    <span class="toc-fab-text">目次</span>
</button>

<!-- Bottom Sheet / Drawer Modal for Mobile TOC -->
<dialog id="toc-modal" class="toc-modal" aria-label="記事の目次">
    <div class="toc-modal-overlay" id="toc-modal-overlay"></div>
    <div class="toc-modal-content">
        <div class="toc-modal-header">
            <h3 class="toc-modal-title">📑 目次</h3>
            <button type="button" id="toc-modal-close" class="toc-modal-close" aria-label="目次を閉じる">&times;</button>
        </div>
        <div class="toc-modal-body" id="toc-modal-body">
            <!-- TOC contents cloned by JS -->
        </div>
    </div>
</dialog>
{{- end -}}
