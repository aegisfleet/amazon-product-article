<footer class="site-footer">
    <div class="container footer-container">
        <nav class="footer-nav" aria-label="フッターナビゲーション">
            <a href="{{ `` | relURL }}" class="footer-nav-link">🏠 ホーム</a>
            <a href="{{ `recommendations/` | relURL }}" class="footer-nav-link">🎯 注目商品10選</a>
            <a href="{{ `bargain/` | relURL }}" class="footer-nav-link">🎁 あともう一品</a>
            <a href="{{ `deals/` | relURL }}" class="footer-nav-link">🔥 セール対象</a>
            <a href="{{ `brand/` | relURL }}" class="footer-nav-link">🏷️ ブランド一覧</a>
        </nav>

        <hr class="footer-divider" />

        <div class="footer-disclaimer">
            <p>
                {{ .Site.Title
                }}は、Amazon.co.jpを宣伝しリンクすることによってサイトが紹介料を獲得できる手段を提供することを目的に設定されたアフィリエイトプログラムである、Amazonアソシエイト・プログラムの参加者です。
            </p>
        </div>

        <div class="footer-bottom">
            <span class="footer-copyright">&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</span>
            <span class="footer-updated">最終更新: {{ now.Format "2006年01月02日" }}</span>
        </div>
    </div>
</footer>
<script src="{{ `js/personalization.js` | relURL }}"></script>
<script src="{{ `js/favorites.js` | relURL }}"></script>
<script src="{{ `js/compare.js` | relURL }}"></script>

{{- if .IsHome -}}
<script src="{{ `js/home-hero-entry-tracking.js` | relURL }}"></script>
<script src="{{ `js/search.js` | relURL }}"></script>
<script src="{{ `js/home-load-more.js` | relURL }}"></script>
<script src="{{ print `js/category-dropdown.js?v=` now.Unix | relURL }}"></script>

{{- end -}}
