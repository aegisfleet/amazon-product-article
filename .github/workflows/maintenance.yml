name: Daily Maintenance


on:
  schedule:
    # Run daily at 05:00 JST (20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  product-update:
    name: Update Oldest Product
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      products-found: ${{ steps.search.outputs.products-found }}
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build

    - name: Find oldest product
      id: find-oldest
      run: |
        OLD_ASIN=$(npx ts-node src/scripts/maintenance-find-oldest.ts --count 15)
        echo "Found oldest ASIN: $OLD_ASIN"
        echo "asin=$OLD_ASIN" >> $GITHUB_OUTPUT

    - name: Run product search
      id: search
      if: steps.find-oldest.outputs.asin != ''
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        INPUT_ASINS: ${{ steps.find-oldest.outputs.asin }}
      run: npm run search:products
    
    - name: Upload product data
      if: steps.search.outputs.products-found == 'true'
      uses: actions/upload-artifact@4cedc5d8ad5e44981157ee0973b7d1627f108fd8 # v4.6.1
      with:
        name: product-data
        path: data/products/
        retention-days: 7

  jules-investigation:
    name: Jules Investigation
    needs: product-update
    if: needs.product-update.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Use Node.js
      uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c483a26c91 # v4.2.1
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Download product data
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d1c # v4.1.7
      with:
        name: product-data
        path: data/products/
    
    - name: Start Jules investigation sessions
      env:
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        JULES_SOURCE: sources/github/${{ github.repository }}
        JULES_STARTING_BRANCH: ${{ github.ref_name }}
        MAX_INVESTIGATION_PRODUCTS: '15'
      run: npm run investigate
    
    - name: Upload session data
      uses: actions/upload-artifact@4cedc5d8ad5e44981157ee0973b7d1627f108fd8 # v4.6.1
      with:
        name: session-data
        path: data/sessions/
        retention-days: 30
