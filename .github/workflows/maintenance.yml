name: Daily Maintenance

on:
  schedule:
    # 1日3回（8時間ごと: 13:17, 21:17, 05:17 JST = 04:17, 12:17, 20:17 UTC）に3件ずつ実行
    - cron: '17 4,12,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-update:
    name: Prepare Oldest Products & Prompts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-prompts: ${{ steps.prompts.outputs.has-prompts }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Find oldest product
      id: find-oldest
      run: |
        OLD_ASIN=$(pnpm exec ts-node src/scripts/maintenance-find-oldest.ts --count 3)
        echo "Found oldest ASIN: $OLD_ASIN"
        echo "asin=$OLD_ASIN" >> $GITHUB_OUTPUT

    - name: Run product search
      id: search
      if: steps.find-oldest.outputs.asin != ''
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        INPUT_ASINS: ${{ steps.find-oldest.outputs.asin }}
      run: pnpm run search:products

    - name: Generate investigation prompts
      id: prompts
      if: steps.search.outputs.products-found == 'true'
      env:
        MAX_INVESTIGATION_PRODUCTS: '3'
      run: pnpm run investigate -- --no-shuffle

    - name: Upload investigation prompts
      if: steps.prompts.outputs.has-prompts == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: maintenance-prompts
        path: data/prompts/
        retention-days: 7

  agy-investigation:
    name: Antigravity Investigation
    needs: product-update
    if: needs.product-update.outputs.has-prompts == 'true'
    runs-on: [self-hosted, e2-micro, agy]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download investigation prompts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: maintenance-prompts
        path: data/prompts/

    - name: Run Antigravity CLI investigation
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: bash .github/workflows/scripts/investigate-products.sh
