name: Product Research Pipeline

on:
  schedule:
    # Run daily at 17:00 JST (08:00 UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Product category to search'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - electronics
          - wired_earphones
          - computers
          - kitchen
          - electric_kettles
          - home
          - appliances
          - women_beauty
          - women_fashion
          - women_appliances
          - women_health
          - kanpo
          - relaxation
          - storage
          - furniture
          - office
          - baby
          - pet
          - outdoor
          - automotive
          - diy
          - toys
          - gaming
          - music
          - watches
          - telework
          - kindle_books
          - novels
          - frozen_bento
          - meal_kits
          - emergency_foods
          - tea_leaves
          - smartphones
          - color_contacts
          - tablets
          - eye_care
          - neck_massager
          - scalp_care
          - cosmetics
          - face_wash
          - shampoo
          - conditioner
          - hair_treatment
          - toner
          - docking_station
          - monitor_arm
          - desk_setup
      max_results:
        description: 'Maximum results per category'
        required: false
        default: '10'
      asins:
        description: 'Specific ASINs to investigate (comma-separated, overrides categories)'
        required: false

jobs:
  product-search:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      products-found: ${{ steps.search.outputs.products-found }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Run product search
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        PRODUCT_CATEGORIES: ${{ github.event.inputs.categories }}
        MAX_RESULTS_PER_CATEGORY: ${{ github.event.inputs.max_results || '10' }}
        INPUT_ASINS: ${{ github.event.inputs.asins }}
      run: npm run search:products

    - name: Upload product data
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: product-data
        path: data/products/
        retention-days: 7

  jules-investigation:
    needs: product-search
    if: needs.product-search.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Download product data
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: product-data
        path: data/products/

    - name: Start Jules investigation sessions
      env:
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        JULES_SOURCE: sources/github/${{ github.repository }}
        JULES_STARTING_BRANCH: ${{ github.ref_name }}
        MAX_INVESTIGATION_PRODUCTS: '15'
      run: npm run investigate

    - name: Upload session data
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: session-data
        path: data/sessions/
        retention-days: 30

# Note: Article generation is handled in Phase 3 (deploy-articles.yml)
# triggered when Jules creates and merges PRs
