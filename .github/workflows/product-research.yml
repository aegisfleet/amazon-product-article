name: Product Research Pipeline

on:
  schedule:
    # Run daily at 16:00 JST (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Product category to search'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - electronics
          - wired_earphones
          - computers
          - kitchen
          - electric_kettles
          - home
          - appliances
          - women_beauty
          - women_fashion
          - women_appliances
          - women_health
          - kanpo
          - relaxation
          - storage
          - furniture
          - office
          - baby
          - pet
          - outdoor
          - automotive
          - diy
          - toys
          - gaming
          - music
          - watches
          - telework
          - kindle_books
          - novels
          - frozen_bento
          - meal_kits
          - emergency_foods
          - tea_leaves
          - smartphones
          - color_contacts
          - tablets
          - eye_care
          - neck_massager
          - scalp_care
          - cosmetics
          - face_wash
          - shampoo
          - conditioner
          - hair_treatment
          - toner
          - docking_station
          - monitor_arm
          - desk_setup
          - supplements
          - mens_hair_care
      max_results:
        description: 'Maximum results per category'
        required: false
        default: '10'
      asins:
        description: 'Specific ASINs to investigate (comma-separated, overrides categories)'
        required: false

jobs:
  product-search:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      products-found: ${{ steps.search.outputs.products-found }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Write ASINs to Job Summary
      if: github.event.inputs.asins != ''
      env:
        INPUT_ASINS: ${{ github.event.inputs.asins }}
      run: |
        echo "### 調査対象のASIN（手動入力）" >> $GITHUB_STEP_SUMMARY
        echo "以下のASINが指定されました：" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        IFS=',' read -ra ASIN_ARR <<< "$INPUT_ASINS"
        for asin in "${ASIN_ARR[@]}"; do
          trimmed_asin=$(echo "$asin" | xargs)
          echo "- \`$trimmed_asin\`" >> $GITHUB_STEP_SUMMARY
        done

    - name: Run product search
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        PRODUCT_CATEGORIES: ${{ github.event.inputs.categories }}
        MAX_RESULTS_PER_CATEGORY: ${{ github.event.inputs.max_results || '10' }}
        INPUT_ASINS: ${{ github.event.inputs.asins }}
      run: pnpm run search:products

    - name: Upload product data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: product-data
        path: data/products/
        retention-days: 7

  jules-investigation:
    needs: product-search
    if: needs.product-search.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Download product data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: product-data
        path: data/products/

    - name: Start Jules investigation sessions
      env:
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        JULES_SOURCE: sources/github/${{ github.repository }}
        JULES_STARTING_BRANCH: ${{ github.ref_name }}
        MAX_INVESTIGATION_PRODUCTS: '15'
      run: pnpm run investigate

    - name: Upload session data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: session-data
        path: data/sessions/
        retention-days: 30

# Note: Article generation is handled in Phase 3 (deploy-articles.yml)
# triggered when Jules creates and merges PRs
