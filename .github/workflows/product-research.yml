name: Product Research Pipeline

on:
  schedule:
    # 1日3回（8時間ごと: 09:17, 17:17, 01:17 JST = 00:17, 08:17, 16:17 UTC）に3件ずつ実行
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Product category to search'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - electronics
          - wired_earphones
          - computers
          - kitchen
          - electric_kettles
          - home
          - appliances
          - women_beauty
          - women_fashion
          - women_appliances
          - women_health
          - kanpo
          - relaxation
          - storage
          - furniture
          - office
          - baby
          - pet
          - outdoor
          - automotive
          - diy
          - toys
          - gaming
          - music
          - watches
          - telework
          - kindle_books
          - novels
          - frozen_bento
          - meal_kits
          - emergency_foods
          - tea_leaves
          - smartphones
          - color_contacts
          - tablets
          - eye_care
          - neck_massager
          - scalp_care
          - cosmetics
          - face_wash
          - shampoo
          - conditioner
          - hair_treatment
          - toner
          - docking_station
          - monitor_arm
          - desk_setup
          - supplements
          - mens_hair_care
      max_results:
        description: 'Maximum results per category'
        required: false
        default: '10'
      asins:
        description: 'Specific ASINs to investigate (comma-separated, overrides categories)'
        required: false

permissions:
  contents: read

jobs:
  product-search:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-prompts: ${{ steps.prompts.outputs.has-prompts }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Run product search
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        PRODUCT_CATEGORIES: ${{ github.event.inputs.categories }}
        MAX_RESULTS_PER_CATEGORY: ${{ github.event.inputs.max_results || '10' }}
        INPUT_ASINS: ${{ github.event.inputs.asins }}
      run: pnpm run search:products

    - name: Generate investigation prompts
      id: prompts
      if: steps.search.outputs.products-found == 'true'
      env:
        MAX_INVESTIGATION_PRODUCTS: '3'
      run: pnpm run investigate

    - name: Upload investigation prompts
      if: steps.prompts.outputs.has-prompts == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: product-research-prompts
        path: data/prompts/
        retention-days: 7

  agy-investigation:
    name: Antigravity Investigation
    needs: product-search
    if: needs.product-search.outputs.has-prompts == 'true'
    runs-on: [self-hosted, e2-micro, agy]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download investigation prompts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: product-research-prompts
        path: data/prompts/

    - name: Run Antigravity CLI investigation
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: bash .github/workflows/scripts/investigate-products.sh
