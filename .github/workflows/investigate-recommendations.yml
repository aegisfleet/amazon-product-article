name: Today's Recommendations Investigation

on:
  schedule:
    # 毎日深夜2時 JST (17:00 UTC) に実行
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-recommendation-prompt:
    name: Prepare Recommendation Prompt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-prompt: ${{ steps.prepare.outputs.has-prompt }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Generate recommendation prompt
      id: prepare
      env:
        MAX_RECOMMENDATION_PRODUCTS: '10'
      run: pnpm run investigate:recommendations

    - name: Upload recommendation prompt
      if: steps.prepare.outputs.has-prompt == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: recommendation-prompt
        path: data/prompts/recommendations-prompt.txt
        retention-days: 7

  agy-recommendations:
    name: Investigate Recommendations with Antigravity CLI
    needs: prepare-recommendation-prompt
    if: needs.prepare-recommendation-prompt.outputs.has-prompt == 'true'
    runs-on: [self-hosted, e2-micro, agy]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download recommendation prompt
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: recommendation-prompt
        path: data/prompts/

    - name: Run Antigravity CLI recommendation investigation
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: bash .github/workflows/scripts/investigate-recommendations.sh
