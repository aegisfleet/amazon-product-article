name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**/*.ts'
      - 'data/brandgroups.json'
      - 'data/categorygroups.json'
      - 'package.json'
      - 'biome.json'
      - 'tsconfig.json'
      - 'tsconfig.eslint.json'
      - 'eslint.config.mjs'
      - 'jest.config.js'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**/*.ts'
      - 'data/brandgroups.json'
      - 'data/categorygroups.json'
      - 'package.json'
      - 'biome.json'
      - 'tsconfig.json'
      - 'tsconfig.eslint.json'
      - 'eslint.config.mjs'
      - 'jest.config.js'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Use Node.js 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Run linting
      run: pnpm run lint

    - name: Build project
      run: pnpm run build

    - name: Run tests
      run: pnpm run test:coverage
