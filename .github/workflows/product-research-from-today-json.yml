name: Today's Recommendations Product Research

on:
  push:
    branches: [main]
    paths:
      - 'data/recommendations/today.json'
  workflow_dispatch:

jobs:
  product-search:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      products-found: ${{ steps.search.outputs.products-found || 'false' }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Extract ASINs from today.json
      id: extract
      run: |
        ASINS=$(node -e "const fs = require('fs'); const path = require('path'); const data = require('./data/recommendations/today.json'); const filtered = data.recommendations.filter(r => !fs.existsSync(path.join('data', 'investigations', r.asin + '.json'))).map(r => r.asin); console.log(filtered.join(','));")
        echo "asins=$ASINS" >> $GITHUB_OUTPUT
        if [ -z "$ASINS" ]; then
          echo "found=false" >> $GITHUB_OUTPUT
        else
          echo "found=true" >> $GITHUB_OUTPUT
        fi

    - name: Run product search
      if: steps.extract.outputs.found == 'true'
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        INPUT_ASINS: ${{ steps.extract.outputs.asins }}
      run: npm run search:products

    - name: Upload product data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: product-data
        path: data/products/
        retention-days: 7

  jules-investigation:
    needs: product-search
    if: needs.product-search.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Download product data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: product-data
        path: data/products/

    - name: Start Jules investigation sessions
      env:
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        JULES_SOURCE: sources/github/${{ github.repository }}
        JULES_STARTING_BRANCH: ${{ github.ref_name }}
        MAX_INVESTIGATION_PRODUCTS: '15'
      run: npm run investigate

    - name: Upload session data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: session-data
        path: data/sessions/
        retention-days: 30

# Note: Article generation is handled in Phase 3 (deploy-articles.yml)
# triggered when Jules creates and merges PRs
