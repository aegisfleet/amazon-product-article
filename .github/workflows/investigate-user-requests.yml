name: User Requests Investigation

on:
  schedule:
    # 毎日 13:00 JST (04:00 UTC) と 21:00 JST (12:00 UTC) に定期実行
    - cron: '0 4,12 * * *'
  workflow_dispatch:

jobs:
  fetch-user-requests:
    name: Fetch User Requests from GAS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asins: ${{ steps.fetch.outputs.asins }}
      products-found: ${{ steps.fetch.outputs.products-found }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Fetch and process user requests
      id: fetch
      env:
        GAS_API_URL: ${{ secrets.GAS_API_URL }}
        GAS_API_TOKEN: ${{ secrets.GAS_API_TOKEN }}
        MAX_INVESTIGATION_PRODUCTS: '5'
      run: pnpm run investigate:user-requests -- --fetch-requests

    - name: Upload user requests session data
      if: steps.fetch.outputs.products-found == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: user-requests-session
        path: data/products/user-requests-session.json
        retention-days: 7

  product-search:
    name: Fetch Product Data from Creators API
    needs: fetch-user-requests
    if: needs.fetch-user-requests.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      products-found: ${{ steps.search.outputs.products-found }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Run product search
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        INPUT_ASINS: ${{ needs.fetch-user-requests.outputs.asins }}
      run: pnpm run search:products

    - name: Upload product data
      if: steps.search.outputs.products-found == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: user-requests-product-data
        path: data/products/
        retention-days: 7

  jules-investigation:
    name: Start Jules Investigation & Update Status
    needs: [fetch-user-requests, product-search]
    if: needs.product-search.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Download product data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: user-requests-product-data
        path: data/products/

    - name: Download user requests session data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: user-requests-session
        path: data/products/

    - name: Start Jules investigation sessions
      env:
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        JULES_SOURCE: sources/github/${{ github.repository }}
        JULES_STARTING_BRANCH: ${{ github.ref_name }}
        MAX_INVESTIGATION_PRODUCTS: '5'
      run: pnpm run investigate

    - name: Update status in GAS
      env:
        GAS_API_URL: ${{ secrets.GAS_API_URL }}
        GAS_API_TOKEN: ${{ secrets.GAS_API_TOKEN }}
      run: pnpm run investigate:user-requests -- --update-status

    - name: Upload session data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: user-requests-session-data
        path: data/sessions/
        retention-days: 30
