name: User Requests Investigation

on:
  schedule:
    # 3時間ごと（1日8回）に定期実行（0:47, 3:47, 6:47, 9:47, 12:47, 15:47, 18:47, 21:47 UTC）
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: '調査する商品の件数'
        required: true
        type: choice
        default: '3'
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'

permissions:
  contents: read

jobs:
  fetch-user-requests:
    name: Fetch User Requests from GAS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asins: ${{ steps.fetch.outputs.asins }}
      products-found: ${{ steps.fetch.outputs.products-found }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Fetch and process user requests
      id: fetch
      env:
        GAS_API_URL: ${{ secrets.GAS_API_URL }}
        GAS_API_TOKEN: ${{ secrets.GAS_API_TOKEN }}
        MAX_INVESTIGATION_PRODUCTS: ${{ inputs.max_products || '3' }}
      run: pnpm run investigate:user-requests -- --fetch-requests

    - name: Upload user requests session data
      if: steps.fetch.outputs.products-found == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: user-requests-session
        path: data/products/user-requests-session.json
        retention-days: 7

  product-search:
    name: Fetch Product Data & Generate Prompts
    needs: fetch-user-requests
    if: needs.fetch-user-requests.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-prompts: ${{ steps.prompts.outputs.has-prompts }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Run product search
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        INPUT_ASINS: ${{ needs.fetch-user-requests.outputs.asins }}
      run: pnpm run search:products

    - name: Generate investigation prompts
      id: prompts
      if: steps.search.outputs.products-found == 'true'
      env:
        MAX_INVESTIGATION_PRODUCTS: ${{ inputs.max_products || '3' }}
      run: pnpm run investigate -- --no-shuffle

    - name: Upload investigation prompts
      if: steps.prompts.outputs.has-prompts == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: user-requests-prompts
        path: data/prompts/
        retention-days: 7

  agy-investigation:
    name: Antigravity Investigation
    needs: [fetch-user-requests, product-search]
    if: needs.product-search.outputs.has-prompts == 'true'
    runs-on: [self-hosted, e2-micro, agy]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download investigation prompts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: user-requests-prompts
        path: data/prompts/

    - name: Run Antigravity CLI investigation
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: bash .github/workflows/scripts/investigate-products.sh

    - name: Upload completed ASINs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: user-requests-completed-asins
        path: data/prompts/completed-asins.txt
        retention-days: 7

  update-gas-status:
    name: Update Status in GAS
    needs: [fetch-user-requests, agy-investigation]
    if: always() && needs.agy-investigation.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Download user requests session data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: user-requests-session
        path: data/products/

    - name: Download completed ASINs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: user-requests-completed-asins
        path: data/prompts/

    - name: Update status in GAS
      env:
        GAS_API_URL: ${{ secrets.GAS_API_URL }}
        GAS_API_TOKEN: ${{ secrets.GAS_API_TOKEN }}
      run: pnpm run investigate:user-requests -- --update-status
