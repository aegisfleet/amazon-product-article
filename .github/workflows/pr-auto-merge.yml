name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    # JulesボットまたはJules関連のユーザーからのPRのみ処理
    if: github.actor == 'jules[bot]' || contains(github.actor, 'jules') || github.actor == 'aegisfleet'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Generate articles
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: |
        git fetch origin ${{ github.base_ref }}
        CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- 'data/investigations/*.json' | tr '\n' ' ')

        if [ -n "$CHANGED_FILES" ]; then
          echo "Found changed files: $CHANGED_FILES"
          npx ts-node src/scripts/article-generation-cli.ts --skip-paapi $CHANGED_FILES
        else
          echo "No investigation files changed. Skipping article generation."
        fi

        npm run sanitize:frontmatter

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f # v3.0.0
      with:
        hugo-version: 'latest'
        extended: true

    - name: Prepare static data
      run: npm run prebuild:hugo

    - name: Build site with Hugo
      run: hugo --minify

    - name: Validate and auto-merge PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: npm run merge:pr

    - name: Trigger deploy workflow
      if: success()
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // マージ後、少し待機してからデプロイをトリガー
          await new Promise(resolve => setTimeout(resolve, 5000));

          console.log('Triggering Deploy Articles workflow...');
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy-articles.yml',
            ref: 'main'
          });
          console.log('Deploy workflow triggered successfully');

    - name: Report merge status
      if: always()
      run: |
        echo "PR #${{ github.event.pull_request.number }} processing completed"
        echo "Author: ${{ github.event.pull_request.user.login }}"
        echo "Note: Deploy workflow will be triggered automatically by push event"
