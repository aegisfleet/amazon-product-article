name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    # JulesボットまたはJules関連のユーザーからのPRのみ処理
    if: github.actor == 'jules[bot]' || contains(github.actor, 'jules') || github.actor == 'aegisfleet'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Analyze changed files
      id: analyze_changes
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: |
        git fetch origin ${{ github.base_ref }}
        
        # Check for investigation changes
        INVESTIGATION_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- 'data/investigations/*.json' | tr '\n' ' ')
        if [ -n "$INVESTIGATION_FILES" ]; then
          echo "Found changed investigation files: $INVESTIGATION_FILES"
          npx ts-node src/scripts/article-generation-cli.ts --skip-paapi $INVESTIGATION_FILES
        else
          echo "No investigation files changed. Skipping article generation."
        fi

        # Check for today.json changes
        if git diff --name-only origin/${{ github.base_ref }} HEAD | grep -q 'data/recommendations/today.json'; then
          echo "today_changed=true" >> $GITHUB_OUTPUT
          echo "today.json has changed."
        else
          echo "today_changed=false" >> $GITHUB_OUTPUT
          echo "today.json has not changed."
        fi

        npm run sanitize:frontmatter

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: 'latest'
        extended: true

    - name: Prepare static data
      run: npm run prebuild:hugo

    - name: Build site with Hugo
      run: hugo --minify

    - name: Validate and auto-merge PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: npm run merge:pr

    - name: Trigger subsequent workflows
      if: success()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          // マージ後、少し待機してからワークフローをトリガー
          await new Promise(resolve => setTimeout(resolve, 5000));

          // 1. デプロイワークフローをトリガー
          console.log('Triggering Deploy Articles workflow...');
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy-articles.yml',
            ref: 'main'
          });
          console.log('Deploy workflow triggered successfully');

          // 2. today.json が変更されていたら商品調査ワークフローをトリガー
          if ("${{ steps.analyze_changes.outputs.today_changed }}" === "true") {
            console.log('Triggering Today Recommendations Product Research workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'product-research-from-today-json.yml',
              ref: 'main'
            });
            console.log('Today Recommendations Product Research workflow triggered successfully');
          } else {
            console.log('today.json not changed, skipping product research workflow.');
          }

    - name: Report merge status
      if: always()
      run: |
        echo "PR #${{ github.event.pull_request.number }} processing completed"
        echo "Author: ${{ github.event.pull_request.user.login }}"
        echo "Note: Deploy workflow will be triggered automatically by push event"
