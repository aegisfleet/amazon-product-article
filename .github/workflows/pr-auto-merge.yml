name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    # JulesボットまたはJules関連のユーザーからのPRのみ処理
    if: github.actor == 'jules[bot]' || contains(github.actor, 'jules') || github.actor == 'aegisfleet' # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # zizmor: ignore[artipacked]

    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Analyze changed files
      id: analyze_changes
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        # ベースブランチをフェッチ。履歴が足りない場合は unshallow する
        git fetch origin $BASE_REF --depth=1 || git fetch origin $BASE_REF
        
        if ! git merge-base origin/$BASE_REF HEAD > /dev/null 2>&1; then
          echo "Common ancestor not found, fetching more history..."
          git fetch --unshallow origin $BASE_REF || git fetch origin $BASE_REF || true
        fi
        
        # Check for investigation changes
        INVESTIGATION_FILES=$(git diff --name-only origin/$BASE_REF HEAD -- 'data/investigations/*.json' | tr '\n' ' ')
        if [ -n "$INVESTIGATION_FILES" ]; then
          echo "Found changed investigation files: $INVESTIGATION_FILES"
          pnpm exec ts-node src/scripts/article-generation-cli.ts --skip-paapi $INVESTIGATION_FILES
        else
          echo "No investigation files changed. Skipping article generation."
        fi

        # Check for today.json changes
        if git diff --name-only origin/$BASE_REF HEAD | grep -q 'data/recommendations/today.json'; then
          echo "today_changed=true" >> $GITHUB_OUTPUT
          echo "today.json has changed."
        else
          echo "today_changed=false" >> $GITHUB_OUTPUT
          echo "today.json has not changed."
        fi

        pnpm run sanitize:frontmatter

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: 'latest'
        extended: true

    - name: Prepare static data
      run: pnpm run prebuild:hugo

    - name: Build site with Hugo
      run: hugo --minify

    - name: Validate and auto-merge PR
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: pnpm run merge:pr

    - name: Trigger subsequent workflows
      if: success()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TODAY_CHANGED: ${{ steps.analyze_changes.outputs.today_changed }}
      with:
        github-token: ${{ github.token }}
        script: |
          // マージ後、少し待機してからワークフローをトリガー
          await new Promise(resolve => setTimeout(resolve, 5000));

          // 1. デプロイワークフローをトリガー
          console.log('Triggering Deploy Articles workflow...');
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy-articles.yml',
            ref: 'main'
          });
          console.log('Deploy workflow triggered successfully');

          // 2. today.json が変更されていたら商品調査ワークフローをトリガー
          if (process.env.TODAY_CHANGED === "true") {
            console.log('Triggering Today Recommendations Product Research workflow...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'product-research-from-today-json.yml',
              ref: 'main'
            });
            console.log('Today Recommendations Product Research workflow triggered successfully');
          } else {
            console.log('today.json not changed, skipping product research workflow.');
          }

    - name: Report merge status
      if: always()
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        echo "PR #$PR_NUMBER processing completed"
        echo "Author: $PR_AUTHOR"
        echo "Note: Deploy workflow will be triggered automatically by push event"
