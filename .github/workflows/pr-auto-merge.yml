name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    # JulesボットまたはJules関連のユーザーからのPRのみ処理
    if: github.actor == 'jules[bot]' || contains(github.actor, 'jules')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Generate articles
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
        AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
      run: npm run generate:articles

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true

    - name: Prepare static data
      run: npm run prebuild:hugo

    - name: Build site with Hugo
      run: hugo --minify

    - name: Validate and auto-merge PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: npm run merge:pr

    - name: Report merge status
      if: always()
      run: |
        echo "PR #${{ github.event.pull_request.number }} processing completed"
        echo "Author: ${{ github.event.pull_request.user.login }}"
        echo "Note: Deploy workflow will be triggered automatically by push event"
