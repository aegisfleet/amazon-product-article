name: Update Cache Order

on:
  schedule:
    # Run daily at 19:00 JST (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # zizmor: ignore[artipacked]
    
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
    
    - name: Sort cache by status
      run: pnpm exec ts-node scripts/sort-cache-by-status.ts
      
    - name: Commit sorted cache
      run: |
        chmod +x .github/workflows/scripts/git-commit-push.sh
        ./.github/workflows/scripts/git-commit-push.sh "chore: Sort product cache by status [skip ci]" "data/cache/paapi-product-cache.json"
