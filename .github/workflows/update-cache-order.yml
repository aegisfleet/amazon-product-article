name: Update Cache Order

on:
  schedule:
    # Run daily at 19:00 JST (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
    - name: Install pnpm
      uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
    
    - name: Sort cache by status
      run: pnpm exec ts-node scripts/sort-cache-by-status.ts
      
    - name: Commit sorted cache
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/cache/paapi-product-cache.json
        # Only commit if there are changes (which there should be if the sort order changed)
        if ! git diff --staged --quiet; then
          git commit -m "chore: Sort product cache by status [skip ci]"
          git push
        else
          echo "No changes to cache order."
        fi
