name: Update Cache Order

on:
  schedule:
    # Run daily at 19:00 JST (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
    
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
    
    - name: Sort cache by status
      run: pnpm exec ts-node src/scripts/maintenance/sort-cache-by-status.ts
      
    - name: Commit sorted cache
      run: |
        chmod +x .github/workflows/scripts/git-commit-push.sh
        ./.github/workflows/scripts/git-commit-push.sh "chore: Sort product cache by status [skip ci]" "data/cache/paapi-product-cache.json"
