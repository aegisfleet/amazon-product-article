name: Biome Check

permissions:
  contents: write

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'content/**'
      - 'static/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Biome
        uses: biomejs/setup-biome@c013c14413fac962770220d93708f368c741400d # v2.3.0

      - name: Run Biome CI with Auto Fix
        run: biome check --write .

      - name: Commit and Push Changes
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: Apply Biome auto-fixes [skip ci]"
            git push
          else
            echo "No changes to commit from Biome."
          fi
