name: Uncovered Deals Investigation

on:
  schedule:
    # 1日3回（8時間ごと: 11:17, 19:17, 03:17 JST = 02:17, 10:17, 18:17 UTC）に3件ずつ実行
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-uncovered-products:
    name: Find Uncovered Deal Products
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      asins: ${{ steps.find.outputs.asins }}
      products-found: ${{ steps.find.outputs.products-found }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Find uncovered deal candidates
      id: find
      env:
        MAX_INVESTIGATION_PRODUCTS: '3'
      run: pnpm run investigate:uncovered-deals

  product-search:
    name: Fetch Latest Product Data & Generate Prompts
    needs: find-uncovered-products
    if: needs.find-uncovered-products.outputs.products-found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-prompts: ${{ steps.prompts.outputs.has-prompts }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Run product search
      id: search
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        INPUT_ASINS: ${{ needs.find-uncovered-products.outputs.asins }}
      run: pnpm run search:products

    - name: Generate investigation prompts
      id: prompts
      if: steps.search.outputs.products-found == 'true'
      env:
        MAX_INVESTIGATION_PRODUCTS: '3'
      run: pnpm run investigate:uncovered-deals -- --investigate

    - name: Upload investigation prompts
      if: steps.prompts.outputs.has-prompts == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: uncovered-deals-prompts
        path: data/prompts/
        retention-days: 7

  agy-investigation:
    name: Antigravity Investigation
    needs: product-search
    if: needs.product-search.outputs.has-prompts == 'true'
    runs-on: [self-hosted, e2-micro, agy]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download investigation prompts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: uncovered-deals-prompts
        path: data/prompts/

    - name: Run Antigravity CLI investigation
      env:
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      run: bash .github/workflows/scripts/investigate-products.sh
