name: Trigger CodeRabbit for Jules
on:
  pull_request:
    types: [opened]

jobs:
  trigger:
    if: startsWith(github.actor, 'google-labs-jules')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const allDataFiles = files.every(file => file.filename.startsWith('data/'));

            if (!allDataFiles) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '@coderabbitai review'
              });
            } else {
              console.log('Skipping CodeRabbit review for data-only changes.');
            }
