name: Organize Categories

# 毎日18:00 JSTに「その他」カテゴリを整理するワークフロー
# categorygroups.jsonに未登録のカテゴリをJulesが適切な親カテゴリに分類

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # 18:00 JST = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  organize-categories:
    name: Organize Categories
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Check for unregistered categories
      id: check
      run: |
        # categorygroups.jsonに登録されていないカテゴリをカウント
        CACHE_CATS=$(cat data/cache/paapi-product-cache.json | jq -r 'to_entries[] | .value.data.categoryInfo.main' | sort | uniq | grep -v null)
        JSON_CATS=$(cat data/categorygroups.json | jq -r '(if type == "array" then . elif type == "object" then (.categoryGroups // (to_entries | map(.value))) else [] end)[] | (.categories // .children // [])[]' | sort | uniq)
        UNREGISTERED=$(comm -23 <(echo "$CACHE_CATS") <(echo "$JSON_CATS") | wc -l)
        echo "Unregistered categories: $UNREGISTERED"
        echo "count=$UNREGISTERED" >> $GITHUB_OUTPUT

    - name: Start Jules category organization
      if: steps.check.outputs.count != '0'
      id: organize
      env:
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        JULES_SOURCE: sources/github/${{ github.repository }}
        JULES_STARTING_BRANCH: ${{ github.ref_name }}
      run: pnpm run organize:categories

    - name: Upload session data
      if: steps.check.outputs.count != '0'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: category-organization-session
        path: data/sessions/category-organization-*.json
        retention-days: 30

    - name: Skip notification
      if: steps.check.outputs.count == '0'
      run: echo "No unregistered categories found. Skipping organization."
