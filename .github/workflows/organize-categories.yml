name: Organize Categories

# 毎日18:00 JSTに「その他」カテゴリを整理するワークフロー
# categorygroups.jsonに未登録のカテゴリをAntigravity CLI (agy) が適切な親カテゴリに分類

permissions:
  contents: read

on:
  schedule:
    # 18:00 JST = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  prepare-category-prompt:
    name: Prepare Category Organization Prompt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-prompt: ${{ steps.organize.outputs.has-prompt }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Build project
      run: pnpm run build

    - name: Generate category organization prompt
      id: organize
      run: pnpm run organize:categories

    - name: Upload category organization prompt
      if: steps.organize.outputs.has-prompt == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: category-organization-prompt
        path: data/prompts/organize-categories-prompt.txt
        retention-days: 7

  agy-organize-categories:
    name: Organize Categories with Antigravity CLI
    needs: prepare-category-prompt
    if: needs.prepare-category-prompt.outputs.has-prompt == 'true'
    runs-on: [self-hosted, e2-micro, agy]
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download category organization prompt
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: category-organization-prompt
        path: data/prompts/

    - name: Run Antigravity CLI category organization
      run: bash .github/workflows/scripts/organize-categories.sh
