name: Google Indexing

permissions:
  contents: write

on:
  schedule:
    - cron: '0 15 * * *' # UTC 15:00 = JST 00:00
  workflow_dispatch: # Allow manual trigger

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Indexing Script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: npx ts-node scripts/index-api.mts

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/indexing-state.json ]; then
            git add data/indexing-state.json
            git commit -m "chore: Google Indexing API 登録履歴の更新" || echo "No changes to commit"
            git push
          fi
