name: Deploy Articles

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'layouts/**'
      - 'static/**'
      - 'content/**'
      - 'config.toml'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# 同時実行を防止
concurrency:
  group: "deploy-articles-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]

    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Cache Hugo binary
      id: cache-hugo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.pnpm/hugo-extended@*/node_modules/hugo-extended/bin
        key: hugo-extended-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Setup Hugo binary
      if: steps.cache-hugo.outputs.cache-hit != 'true'
      run: |
        for i in 1 2 3 4 5; do
          echo "Attempt $i to install Hugo binary..."
          if pnpm rebuild hugo-extended; then
            echo "Hugo binary setup succeeded."
            exit 0
          fi
          if [ "$i" -lt 5 ]; then
            echo "Download failed, retrying in 20 seconds..."
            sleep 20
          fi
        done
        echo "Failed to setup Hugo binary after 5 attempts."
        exit 1

    - name: Build project
      run: pnpm run build

    - name: Generate articles
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MAX_FETCH_ASINS: '5000'
      run: |
        pnpm run classify:products -- --limit 50 --concurrency 2
        pnpm run generate:articles

    - name: Commit fetched cache (early commit)
      if: always()
      timeout-minutes: 4
      run: |
        chmod +x .github/workflows/scripts/git-commit-push.sh
        ./.github/workflows/scripts/git-commit-push.sh "ビルド成果物の更新 [skip ci]" "data/cache/paapi data/product-categories.json"

    - name: Prepare static data
      run: pnpm run prebuild:hugo

    - name: Commit build artifacts
      if: always()
      timeout-minutes: 4
      run: |
        chmod +x .github/workflows/scripts/git-commit-push.sh
        ./.github/workflows/scripts/git-commit-push.sh "ビルド成果物の更新 [skip ci]" "data/cache/paapi data/product-categories.json"

    - name: Build site with Hugo
      run: pnpm run build:hugo

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
