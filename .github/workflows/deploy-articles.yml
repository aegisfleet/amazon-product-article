name: Deploy Articles

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'layouts/**'
      - 'static/**'
      - 'content/**'
      - 'config.toml'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# GitHub Pages へのデプロイ権限

# 同時実行を防止
concurrency:
  group: "deploy-articles-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        lfs: true
    
    - name: Sync with latest main
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B main
        git pull --rebase origin main

    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
    
    - name: Build project
      run: pnpm run build
    
    - name: Generate articles
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      run: pnpm run generate:articles
    
    
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: 'latest'
        extended: true
    
    - name: Prepare static data
      run: pnpm run prebuild:hugo
    
    - name: Commit build artifacts
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/cache/paapi-product-cache.json
        # 変更がある場合のみコミット
        if ! git diff --staged --quiet; then
          git commit -m "ビルド成果物の更新 [skip ci]"
          # プッシュに失敗した場合（競合など）、リベースして再試行
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            else
              echo "Push failed on attempt $i, pulling with rebase and retrying..."
              # --autostash を使用して、未ステージングの変更があってもリベース可能にする
              if git pull --rebase --autostash origin main; then
                if [ $i -eq 3 ]; then
                  echo "Push failed after 3 attempts"
                  exit 1
                fi
              else
                echo "Rebase failed, aborting..."
                git rebase --abort || true
                exit 1
              fi
            fi
          done
        fi
    
    - name: Build site with Hugo
      run: hugo --minify
    
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
