name: Deploy Articles

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'layouts/**'
      - 'static/**'
      - 'content/**'
      - 'config.toml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# GitHub Pages へのデプロイ権限
permissions:
  contents: write
  pages: write
  id-token: write

# 同時実行を防止
concurrency:
  group: "deploy-articles-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Sync with latest main
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B main
        git pull --rebase origin main

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Generate articles
      env:
        AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
        AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
        AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      run: npm run generate:articles
    
    - name: Commit PA-API Cache
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/cache/paapi-product-cache.json
        # Only commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "Update PA-API product cache [skip ci]"
          # Retry push with rebase if it fails (handles concurrent workflow conflicts)
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            else
              echo "Push failed on attempt $i, pulling with rebase and retrying..."
              git pull --rebase origin main
              if [ $i -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
            fi
          done
        fi
    
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true
    
    - name: Prepare static data
      run: npm run prebuild:hugo
    
    - name: Build site with Hugo
      run: hugo --minify
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
