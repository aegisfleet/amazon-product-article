# Hugo Configuration for Amazon Product Articles
# https://gohugo.io/getting-started/configuration/

# Canonical production URL (www)
baseURL = "https://www.amazon-hikaku.com/"
relativeURLs = false
languageCode = "ja"
title = "ポちのAmazon商品徹底比較.com"

defaultContentLanguage = "ja"

# Timezone and build settings
timeZone = "Asia/Tokyo"
buildFuture = true

[params]
description = "高評価の商品・価格帯・主要スペックを一覧で比較。Amazon売れ筋商品の徹底調査レポートにより、あなたの用途や予算に合う最適な選択肢が短時間で見つかります。"

# Japanese-friendly settings
hasCJKLanguage = true

# Disable unused features for faster builds
# Disable unused features for faster builds
# disableKinds = ["RSS", "sitemap", "robotsTXT"]

# Output configuration
[outputs]
  home = ["HTML", "RSS", "Robots", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

# Build settings
[build]
  writeStats = false

# Markup settings - critical for proper Markdown rendering
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allow raw HTML in Markdown files (for custom spans, etc.)
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

# URL settings - keep article URLs at root level like /B07DZZJ2B9/
[permalinks]
  articles = "/:filename/"

# Sitemap settings
[sitemap]
  changeFreq = "monthly"
  priority = 0.5

# Git info for automatic lastmod
enableGitInfo = true

# Front matter date resolution
[frontmatter]
  lastmod = [":git", "lastmod", "last_investigated", "date"]

# Minify output
[minify]
  minifyOutput = false

# Related content (disabled for now)
[related]
  threshold = 0
  includeNewer = false
  toLower = false

[taxonomies]
  category = "categories"
  tag = "tags"
