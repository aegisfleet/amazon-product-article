# Hugo Configuration for Amazon Product Articles
# https://gohugo.io/getting-started/configuration/

# Canonical production URL (www)
baseURL = "https://www.amazon-hikaku.com/"
relativeURLs = false
locale = "ja"
title = "ポちのAmazon商品徹底比較.com"

defaultContentLanguage = "ja"

# Timezone and build settings
timeZone = "Asia/Tokyo"
buildFuture = true

[params]
description = "高評価の商品・価格帯・主要スペックを一覧で比較。Amazon売れ筋商品の徹底調査レポートにより、あなたの用途や予算に合う最適な選択肢が短時間で見つかります。"
productRequestFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSc09aO5nj3y247QRkO2TQZ_ASH1J5mljIB--2ym1CkwRGUVqw/viewform"
productRequestEntryId = "entry.662198856"

[params.affiliate.moshimo]
  rakuten_a_id = "5756223"
  rakuten_p_id = "54"
  rakuten_pc_id = "54"
  rakuten_pl_id = "27059"
  yahoo_a_id = "5756224"
  yahoo_p_id = "1225"
  yahoo_pc_id = "1925"
  yahoo_pl_id = "27061"

# Japanese-friendly settings
hasCJKLanguage = true

# Disable unused features for faster builds
# Disable unused features for faster builds
# disableKinds = ["RSS", "sitemap", "robotsTXT"]

# Output configuration
[outputs]
  home = ["HTML", "RSS", "Robots", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

# Build settings
[build]
  writeStats = false

# Markup settings - critical for proper Markdown rendering
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allow raw HTML in Markdown files (for custom spans, etc.)
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

# URL settings - keep article URLs at root level like /B07DZZJ2B9/
[permalinks]
  articles = "/:contentbasename/"

# Sitemap settings
[sitemap]
  changeFreq = "monthly"
  priority = 0.5

# Git info for automatic lastmod (Disabled for build performance)
enableGitInfo = false

# Front matter date resolution
[frontmatter]
  lastmod = ["last_investigated", "date", "lastmod"]

# Minify output
[minify]
  minifyOutput = false

# Related content (disabled for now)
[related]
  threshold = 0
  includeNewer = false
  toLower = false

[taxonomies]
  category = "categories"
  tag = "tags"

# Module mounts - exclude investigations directory to speed up build
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data/brandgroups.json"
    target = "data/brandgroups.json"
  [[module.mounts]]
    source = "data/categories.yml"
    target = "data/categories.yml"
  [[module.mounts]]
    source = "data/categorygroups.json"
    target = "data/categorygroups.json"
  [[module.mounts]]
    source = "data/recommendations"
    target = "data/recommendations"
  [[module.mounts]]
    source = "data/cache"
    target = "data/cache"
